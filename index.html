<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Missing Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:linear-gradient(135deg,#020617,#0f172a);color:#fff;padding:20px}
.container{max-width:1400px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;flex-wrap:wrap}
.title{font-size:36px;font-weight:bold;background:linear-gradient(90deg,#22d3ee,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#94a3b8;margin-top:5px}
.btns button{padding:12px 20px;border:none;border-radius:14px;margin-left:10px;cursor:pointer}
.export{background:#10b981;color:#fff}
.refresh{background:#8b5cf6;color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px}
.card{background:rgba(30,41,59,.8);padding:20px;border-radius:20px}
.card h2{margin-top:10px;font-size:30px}
.filter{display:flex;gap:15px;margin-bottom:30px;flex-wrap:wrap}
.filter input,.filter select{flex:1;padding:15px;border:none;border-radius:14px;background:#1e293b;color:#fff}
.table-box{overflow:auto;background:rgba(30,41,59,.8);border-radius:20px}
table{width:100%;border-collapse:collapse}
th,td{padding:18px;text-align:left}
th{background:#334155}
tr:nth-child(even){background:rgba(51,65,85,.3)}
.red{color:#f87171}
.blue{color:#38bdf8}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div>
<div class="title">Data Missing Tinh Lệch</div>
<div class="subtitle">Khớp dữ liệu theo thời gian thực</div>
</div>
<div class="btns">
<button class="export">Xuất Excel</button>
<button class="refresh">Làm mới</button>
</div>
</div>

<div class="cards">
<div class="card"><p>Tổng SKU</p><h2>436</h2></div>
<div class="card"><p>Đã kiểm</p><h2>120</h2></div>
<div class="card"><p>Chưa kiểm</p><h2>316</h2></div>
<div class="card"><p>Sai lệch</p><h2>56</h2></div>
</div>

<div class="filter">
<input placeholder="Tìm theo SKU hoặc tên sản phẩm...">
<select><option>Tất cả</option></select>
</div>

<div class="table-box">
<table>
<thead>
<tr><th>#</th><th>Sản phẩm / SKU</th><th>Cần kiểm</th><th>Đã kiểm</th><th>Chưa kiểm</th></tr>
</thead>
<tbody>
<tr><td>1</td><td>Nhỏ mắt demo</td><td>100</td><td class="blue">0</td><td class="red">-100</td></tr>
<tr><td>2</td><td>Gel scar demo</td><td>81</td><td class="blue">0</td><td class="red">-81</td></tr>
<tr><td>3</td><td>Berberin demo</td><td>67</td><td class="blue">2</td><td class="red">-65</td></tr>
</tbody>
</table>
</div>
</div>
</body>
</html>
